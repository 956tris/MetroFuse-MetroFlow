name: MetroFlow release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metroflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the matching MetroFuse API and SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 956tris/MetroFuse
          ref: f961b46c21526bc9a3775b40720fc0faeca9669a
          path: .ci/metrofuse
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android packaging tools
        run: sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0"
      - name: Build API and SDK JARs
        working-directory: .ci/metrofuse
        run: bash ./gradlew :plugin-api:desktopJar :plugin-sdk:desktopJar --no-daemon --max-workers=2 --no-configuration-cache
      - name: Build, test, and package Native and JavaScript plugins
        run: |
          bash ./gradlew :native:desktopTest :native:packagePluginJar :native:packagePluginApk \
            "-PmetrofuseApiJar=$GITHUB_WORKSPACE/.ci/metrofuse/plugin-api/build/libs/plugin-api-desktop-1.1.0.jar" \
            "-PmetrofuseSdkJar=$GITHUB_WORKSPACE/.ci/metrofuse/plugin-sdk/build/libs/plugin-sdk-desktop-1.1.0.jar" \
            --no-daemon --max-workers=2 --no-configuration-cache
          node tests/test_metroflow.mjs
          python3 tests/check_native_package.py
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          js_root = Path("javascript")
          manifest = json.loads((js_root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("runtime") != "javascript" or manifest.get("api") != "1.1.0":
              raise SystemExit("Unexpected javascript/manifest.json")
          files = sorted(p for p in js_root.rglob("*") if p.is_file() and p.name != "manifest.json")
          integrity = {}
          entries = {}
          for path in files:
              rel = path.relative_to(js_root).as_posix()
              data = path.read_bytes()
              integrity[rel] = hashlib.sha256(data).hexdigest()
              entries[rel] = data
          manifest["integrity"] = integrity
          out_dir = Path("build/outputs/plugins")
          out_dir.mkdir(parents=True, exist_ok=True)
          out_mfp = out_dir / "metroflow.mfp"
          with zipfile.ZipFile(out_mfp, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for name, data in [("manifest.json", json.dumps(manifest, ensure_ascii=False, separators=(",", ":")).encode("utf-8")), *entries.items()]:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zf.writestr(info, data)
          print(f"Packed {out_mfp} with {len(entries) + 1} entries")
          PY
          (cd build/outputs/plugins && sha256sum metroflow.apk metroflow.jar metroflow.mfp > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metroflow-${{ github.sha }}
          path: |
            build/outputs/plugins/metroflow.apk
            build/outputs/plugins/metroflow.jar
            build/outputs/plugins/metroflow.mfp
            build/outputs/plugins/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.repository_owner == '956tris' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: metroflow-${{ github.sha }}
          path: dist
      - name: Verify checksums and manifests
        run: |
          (cd dist && sha256sum --strict --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          nat_v = json.loads(Path("native/manifest.json").read_text(encoding="utf-8"))["version"]
          js_v = json.loads(Path("javascript/manifest.json").read_text(encoding="utf-8"))["version"]
          for name, loc, pid, ver in [
              ("metroflow.jar", "manifest.json", "dev.metrofuse.metroflow.native", nat_v),
              ("metroflow.apk", "assets/metrofuse/manifest.json", "dev.metrofuse.metroflow.native", nat_v),
              ("metroflow.mfp", "manifest.json", "dev.metrofuse.metroflow.javascript", js_v),
          ]:
              with ZipFile(Path("dist") / name) as zf:
                  m = json.loads(zf.read(loc))
                  if m["id"] != pid or m["version"] != ver:
                      raise SystemExit(f"Manifest mismatch in {name}: {m}")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          notes="MetroFlow $ver: Spotify-style dark UI overhaul for Native Kotlin and JavaScript (.mfp), including custom Settings and Plugins screens via ui.settings and ui.plugins. Built for MetroFuse 10.0 Beta 7 (API 1.1.0)."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/metroflow.apk dist/metroflow.jar dist/metroflow.mfp dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "MetroFlow $ver" --notes "$notes"
          else
            gh release create "$tag" dist/metroflow.apk dist/metroflow.jar dist/metroflow.mfp dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MetroFlow $ver" --notes "$notes" --latest
          fi
